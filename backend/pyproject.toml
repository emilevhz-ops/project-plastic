[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Emile Van Herzeele", email = "emile.vhz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt<4.1",
    "fastapi>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
